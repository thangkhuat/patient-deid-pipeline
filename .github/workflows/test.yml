name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Same commit SHAs as deploy-frontend.yml. Pinned, not tagged: this
      # job can replace code running under roles with KMS decrypt access.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::471116065597:role/patient-deid-github-actions-lambda-deploy
          aws-region: ap-southeast-2
      - run: zip -r lambda.zip src -x '*__pycache__*'
      # update-function-code returns once AWS accepts the upload; the wait
      # holds until LastUpdateStatus is Successful (fails on Failed), so a
      # green job means the code is live. `function-updated`, not -v2: v2
      # polls GetFunction, which the role deliberately isn't granted.
      - run: |
          for function in patient-deid-pipeline patient-deid-upload-backend patient-deid-review-backend; do
            aws lambda update-function-code --function-name "$function" --zip-file fileb://lambda.zip
            aws lambda wait function-updated --function-name "$function"
          done
