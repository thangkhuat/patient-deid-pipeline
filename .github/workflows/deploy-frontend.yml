# .github/workflows/deploy-frontend.yml
name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:   # manual run from main; the role's trust policy rejects any other ref

permissions:
  id-token: write   # required -- this job's #1 most common failure is forgetting this line
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags: a tag can be moved to different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::471116065597:role/patient-deid-github-actions-frontend-deploy
          aws-region: ap-southeast-2
      - run: aws s3 sync site/ s3://patient-deid-frontend/ --delete
      # Without this, CloudFront keeps serving cached copies for up to 24h.
      - run: aws cloudfront create-invalidation --distribution-id EDLP358TFVTK5 --paths "/*"
